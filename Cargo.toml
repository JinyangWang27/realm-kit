[workspace]
members = ["crates/realmkit-spec", "crates/realmkit-engine", "crates/realmkit-worldgen", "crates/realmkit-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
realmkit-spec = { path = "crates/realmkit-spec" }
realmkit-engine = { path = "crates/realmkit-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
